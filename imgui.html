<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>imgui image test</title>
  <style>html,body,canvas{height:100%;margin:0}#imgui-canvas{width:100%;height:100%;display:block}</style>
</head>
<body>
  <canvas id="imgui-canvas"></canvas>

  <script type="module">
    import { ImGui, ImGuiImplWeb } from "https://esm.sh/@mori2003/jsimgui@0.8.0";

    const canvas = document.getElementById("imgui-canvas");
    canvas.width = 1024;
    canvas.height = 768;

    (async () => {
      await ImGuiImplWeb.Init({ canvas, enableDemos: false });

      console.log("ImGui exists:", typeof ImGui);
      console.log("ImGuiImplWeb exists:", typeof ImGuiImplWeb);
      try {
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.src = "assets/img/atm.png";
          i.onload = () => resolve(i);
          i.onerror = (e) => reject(new Error("image load failed"));
        });

        const gl = (ImGuiImplWeb && (ImGuiImplWeb.gl || (ImGuiImplWeb.GetGLContext && ImGuiImplWeb.GetGLContext()))) || canvas.getContext("webgl2");
        const tex = gl.createTexture();
        const texId = (ImGuiImplWeb && typeof ImGuiImplWeb.RegisterTexture === 'function') ? ImGuiImplWeb.RegisterTexture(tex) : tex;
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        gl.bindTexture(gl.TEXTURE_2D, null);

        function frame() {
          ImGuiImplWeb.BeginRender();

          ImGui.Begin("projects");
          ImGui.Text("here are some pretty cool stuff i made;");
          if (ImGui.TreeNode("lithium's atm")) {
            ImGui.Text("cool deposit game i made using ");
            ImGui.SameLine();
            if (ImGui.TextLink("regui")) globalThis.open("https://github.com/depthso/Dear-Regui", "_blank");

            ImGui.Text("game link: ");
            ImGui.SameLine();
            if (ImGui.TextLink("roblox.com/games/106912201193396")) globalThis.open("https://www.roblox.com/games/106912201193396/", "_blank");

            try {
              ImGui.Image(texId, [img.width, img.height]);
            } catch (e) {
              ImGui.Text("Image draw failed: " + (e && e.message));
              console.error("ImGui.Image failed:", e);
            }

            ImGui.TreePop();
          }
          ImGui.End();

          ImGuiImplWeb.EndRender();
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      } catch (err) {
        console.error("fatal:", err);
        document.body.innerText = "Fatal: " + err.message;
      }
    })();
  </script>
</body>
</html>
