<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>imgui image debug</title>
<style>
  html,body{height:100%;margin:0;background:#111}
  #imgui-canvas{width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="imgui-canvas"></canvas>
<script type="module">
import { ImGui, ImGuiImplWeb } from "https://esm.sh/@mori2003/jsimgui@0.8.0";

const canvas = document.getElementById("imgui-canvas");
canvas.width = 1024;
canvas.height = 768;

(async () => {
  await ImGuiImplWeb.Init({ canvas, enableDemos: false });
  console.log("ImGui exists:", typeof ImGui);
  console.log("ImGuiImplWeb exists:", typeof ImGuiImplWeb);

  // load image DOM element first
  let img;
  try {
    img = await new Promise((res, rej) => {
      const i = new Image();
      i.src = "assets/img/atm.png";
      i.onload = () => res(i);
      i.onerror = (e) => rej(new Error("image load failed"));
    });
    console.log("image loaded:", img.width, img.height);
  } catch (e) {
    console.error("image load failed:", e);
    document.body.innerText = "image load failed: " + e.message;
    return;
  }

  // pick GL context used by the ImGui implementation, fallback to canvas
  const gl =
    (ImGuiImplWeb && (ImGuiImplWeb.gl || ImGuiImplWeb.GetGLContext && ImGuiImplWeb.GetGLContext())) ||
    canvas.getContext("webgl2") ||
    canvas.getContext("webgl") ||
    null;
  console.log("GL context chosen:", !!gl, gl && gl.canvas === canvas);

  // create texture using that GL context
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  // try without UNPACK_FLIP_Y_WEBGL first to avoid warning; flip only if necessary
  try { gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); } catch(e){}
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.bindTexture(gl.TEXTURE_2D, null);
  console.log("created GL texture:", tex);

  // attempt to register texture via ImGuiImplWeb helpers (many builds expose different names)
  let texId = null;
  const registerNames = [
    "RegisterTexture","registerTexture",
    "CreateTextureFromImage","createTextureFromImage",
    "CreateTexture","createTexture",
    "AddTexture","addTexture"
  ];
  for (const name of registerNames) {
    try {
      if (ImGuiImplWeb && typeof ImGuiImplWeb[name] === "function") {
        const out = ImGuiImplWeb[name](img);           // try passing DOM image
        if (out) { texId = out; console.log(name, "->", out); break; }
        // try passing GL texture
        const out2 = ImGuiImplWeb[name](tex);
        if (out2) { texId = out2; console.log(name, "->", out2); break; }
      }
    } catch (e) {
      console.log(name, "threw:", e && e.message);
    }
  }

  // if no registration helper returned anything, use raw GL texture
  if (!texId) {
    texId = tex;
    console.log("no register helper found; using raw GL texture as texId");
  }

  // normalize texId shape if wrapper returned an object like {id:...} or {tex:...}
  if (texId && typeof texId === "object") {
    if ("id" in texId) texId = texId.id;
    else if ("tex" in texId) texId = texId.tex;
    // else leave it as-is (some builds accept an object)
  }
  console.log("final texId:", texId, "typeof:", typeof texId);

  // small flag to only create a big UI once the pipeline is likely ready
  let ready = true;

  function frame() {
    ImGuiImplWeb.BeginRender();

    ImGui.Begin("projects");
    ImGui.Text("debug: ImGui + texture probe");
    ImGui.Separator();
    ImGui.Text(`img: ${img.width}x${img.height}`);
    ImGui.Text(`tex: ${String(texId).slice(0,60)}`);
    ImGui.Text("If you do not see the image below, copy the two console lines and paste them back:");

    if (ImGui.TreeNode("lithium's atm")) {
      ImGui.Text("cool deposit game i made using "); ImGui.SameLine();
      if (ImGui.TextLink("regui")) globalThis.open("https://github.com/depthso/Dear-Regui", "_blank");
      ImGui.Text("game link: "); ImGui.SameLine();
      if (ImGui.TextLink("roblox.com/games/106912201193396")) globalThis.open("https://www.roblox.com/games/106912201193396/", "_blank");

      // Attempt multiple draw calls (different flavors) so one of them should work for your build
      try { ImGui.Image(texId, [img.width, img.height]); ImGui.Text("draw: ImGui.Image(texId, [w,h]) called"); } catch(e){ ImGui.Text("draw1 failed: "+(e && e.message)); }
      try { ImGui.Image(tex, [img.width, img.height]); ImGui.Text("draw: ImGui.Image(raw tex, [w,h]) called"); } catch(e){ ImGui.Text("draw2 failed: "+(e && e.message)); }
      try {
        // try drawlist addImage if available
        const dl = ImGui.GetWindowDrawList();
        const p = ImGui.GetCursorScreenPos();
        dl.AddImage && dl.AddImage(texId || tex, p, { x: p.x + img.width, y: p.y + img.height });
        ImGui.Text("drawlist.AddImage called (if supported)");
      } catch(e){ ImGui.Text("drawlist failed: "+(e && e.message)); }

      ImGui.TreePop();
    }

    ImGui.End();

    ImGuiImplWeb.EndRender();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
