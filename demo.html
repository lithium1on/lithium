<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lithium's home</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        body {
            background: url('assets/img/bliss.png') no-repeat center center;
            background-size: cover;
        }

        #imgui-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: transparent;
        }
    </style>
</head>
<body>
    <canvas id="imgui-canvas"></canvas>
    <script type="module">
        import { ImGui, ImGuiImplWeb } from "https://esm.sh/@mori2003/jsimgui";

        (async () => {
            const webgl2 = document.querySelector("#imgui-canvas");
            await ImGuiImplWeb.Init({ canvas: webgl2 });

            function frame() {
                ImGuiImplWeb.BeginRender();
				ImGui.Begin("about");
				ImGui.Text("hi, i'm lithium.\ni like eating batteries (sarcasm)\nrelationship helper\nfrench guy\n\nmy time: {time}\nmy lovely weather: {weather}");
				ImGui.End();

                ImGui.Begin("projects");
                ImGui.Text('here are some pretty cool stuff i made;\n\n');
                if (ImGui.TreeNode("lithium's atm")) {
                    ImGui.Text("cool deposit game i made using");
                    ImGui.SameLine();
                    if (ImGui.TextLink("regui")) {
                        globalThis.open("https://github.com/depthso/Dear-Regui", "_blank");
                    }

                    ImGui.Text("game link:");
                    ImGui.SameLine();
                    if (ImGui.TextLink("https://www.roblox.com/games/106912201193396")) {
                        globalThis.open("https://www.roblox.com/games/106912201193396/", "_blank");
                    }

                    ImGui.TreePop();
                }

				ImGui.End();

                ImGuiImplWeb.EndRender();
                requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
        })();
    </script>
</body>
</html>
